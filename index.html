<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChunkFlow · 영어 문장 읽기</title>
  <script type="module" crossorigin src="./assets/index-D618676M.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-CnGhU2aC.css">
</head>
<body>
<div id="app">
  <header class="top">
    <section id="stream" class="stream" aria-live="polite"></section>
    <div id="hint" class="hint" aria-live="polite"></div>
  </header>
  <header id="frame" class="frame" aria-hidden="true"></header>
  <main id="viewport" class="viewport">
    <div id="preview" class="preview" hidden></div>
    <section id="stage-native" class="stage-panel" aria-label="원어민 읽기"><span class="side-name">원어민</span></section>
    <section id="stage-beginner" class="stage-panel" aria-label="초보 읽기" hidden><span class="side-name">초보</span></section>
    <div id="title-card" class="title-card" hidden></div>
    <div id="prediction" class="prediction" role="group" aria-label="다음에 올 것 고르기" hidden></div>
    <div id="flash" class="flash"></div>
    <div id="errors" class="errors" hidden></div>
  </main>
  <footer id="controls" class="controls">
    <button id="btn-play" class="big" title="재생 / 일시정지 (Space)" aria-label="재생"><span class="control-icon" aria-hidden="true">▶</span><span class="control-label">재생</span></button>
    <button id="btn-step" class="big" title="한 덩어리씩 (→)" aria-label="한 덩어리"><span class="control-icon" aria-hidden="true">⏭</span><span class="control-label">한 덩어리</span></button>
    <button id="btn-restart" class="big" title="처음부터 (R)" aria-label="처음부터"><span class="control-icon" aria-hidden="true">↺</span><span class="control-label">처음부터</span></button>
    <label class="mode">보기 <select id="sel-mode">
      <option value="native">원어민</option><option value="beginner">초보</option><option value="compare">둘 다</option>
    </select></label>
    <span class="grow"></span>
    <details class="settings">
      <summary title="설정" aria-label="설정"><span class="control-icon" aria-hidden="true">⚙</span><span class="control-label">설정</span></summary>
      <div class="settings-panel">
        <label>문장 <select id="sel-sentence"></select></label>
        <label>재생 목록 <select id="sel-playlist"></select></label>
        <div class="checks">
          <label class="check"><input id="chk-continuous" type="checkbox"> 연속</label>
          <label class="check"><input id="chk-loop" type="checkbox"> 반복</label>
          <label class="check"><input id="chk-shuffle" type="checkbox"> 섞기</label>
          <label class="check"><input id="chk-predict" type="checkbox"> 맞혀 보기</label>
        </div>
        <label>속도 <select id="sel-speed">
          <option>0.5</option><option>0.75</option><option selected>1</option><option>1.5</option><option>2</option>
        </select></label>
        <label>위 문장 뜻 <select id="sel-gloss">
          <option value="all">보기</option><option value="signal">신호만</option><option value="off">끄기</option>
        </select></label>
        <label>지나간 문장 <select id="sel-trail">
          <option value="long">길게</option><option value="normal" selected>보통</option><option value="short">짧게</option>
        </select></label>
      </div>
    </details>
  </footer>
</div>
</body>
</html>
